name: remedios_naturales_app
description: "Remedios Naturales - Tu guía de bienestar"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Persistencia local
  shared_preferences: ^2.3.4
  
  # Navegación
  go_router: ^14.8.1
  
  # Estado
  provider: ^6.1.2
  
  # UI
  flutter_staggered_animations: ^1.1.1
  
  # Íconos
  tabler_icons: ^2.5.0+1
  supabase_flutter: ^2.16.0
  # Deep links (recuperación de contraseña). Dependencia directa: el
  # manejo del deep link vive en main.dart (el observer del SDK se
  # desactiva para no perder el evento passwordRecovery en cold start).
  app_links: ^7.0.0
  google_mobile_ads: ^9.0.0

  # Pagos (Google Play Billing). Solo se ejercita en release con
  # productos configurados en Play Console; en dev se usa el Mock.
  in_app_purchase: ^3.2.0
  # Platform addition de Android (queryPastPurchases para restore en frío).
  in_app_purchase_android: ^0.5.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/digestivo.json
    - assets/data/nervioso.json
    - assets/data/respiratorio.json
    - assets/data/inmunitario.json
    - assets/data/cardiovascular.json
    - assets/data/hormonal.json
    - assets/data/musculoesqueletico.json
    - assets/data/urinario.json
    - assets/data/dermico.json
    - assets/data/sensorial.json
    - assets/data/condiciones_index.json
    - assets/data/sintomas_cruzados.json
    - assets/data/todas_las_recetas.json
    - assets/data/hierbas.json
    - assets/data/preparaciones_tradicionales.json
    - assets/images/recetas/
    - assets/images/sistemas/
